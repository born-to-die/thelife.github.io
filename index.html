<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Life Achievements</title>
<meta name="description" content="Цели и события жизни по месяцам в стиле игровых достижений">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Achievements">
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel2: #1b2030;
    --border: #2a3144;
    --text: #e6e9f0;
    --muted: #8a93a8;
    --accent: #7c5cff;
    --accent2: #3dd6f5;
    --gold: #f5c542;
    --danger: #ff5c7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a1f3a 0%, transparent 60%),
                radial-gradient(900px 500px at 90% 10%, #2a1a3a 0%, transparent 60%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: rgba(20,24,33,0.6);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-size: 22px;
    box-shadow: 0 0 24px rgba(124,92,255,0.4);
  }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
  .brand small { color: var(--muted); font-size: 12px; }
  .month-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .month-bar input {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 14px;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent), #5a42e0);
    color: #fff; border: none; border-radius: 8px;
    padding: 9px 14px; font-size: 14px; cursor: pointer;
    transition: transform .12s, box-shadow .12s;
    box-shadow: 0 4px 14px rgba(124,92,255,0.3);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,92,255,0.45); }
  .btn.ghost { background: var(--panel2); box-shadow: none; border: 1px solid var(--border); }
  .btn.danger { background: linear-gradient(135deg, var(--danger), #d93a5c); box-shadow: 0 4px 14px rgba(255,92,122,0.3); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  main { padding: 28px; max-width: 1200px; margin: 0 auto; }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 4px;
    background: linear-gradient(135deg, var(--gold), #ff9f43); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; position: relative; overflow: hidden;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(124,92,255,0.25); }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(200px 120px at 0% 0%, rgba(124,92,255,0.12), transparent 70%);
    pointer-events: none;
  }
  .card .icon {
    width: 52px; height: 52px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 28px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
  }
  .card h3 { margin: 12px 0 4px; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .card .actions { margin-top: 12px; display: flex; gap: 8px; }
  .card .actions button { flex: 1; padding: 6px; font-size: 12px; border-radius: 6px; }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    border: 2px dashed var(--border); border-radius: 16px;
  }
  .empty .big { font-size: 48px; margin-bottom: 8px; }

  /* modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
    backdrop-filter: blur(4px); padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; width: 100%; max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .icon-picker {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    max-height: 160px; overflow: auto; padding: 6px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  }
  .icon-picker button {
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    font-size: 20px; padding: 6px; cursor: pointer; color: var(--text);
  }
  .icon-picker button:hover { background: var(--panel); }
  .icon-picker button.selected { border-color: var(--accent); background: rgba(124,92,255,0.15); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
  .modal-actions .spacer { flex: 1; }

  .lib-list { overflow: auto; flex: 1; min-height: 120px; max-height: 46vh; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .lib-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .lib-item:hover { border-color: var(--accent); }
  .lib-item.assigned { border-color: rgba(61,214,245,0.55); background: rgba(61,214,245,0.08); }
  .lib-item .li-icon { font-size: 24px; width: 34px; text-align: center; flex: none; }
  .lib-item .li-body { flex: 1; min-width: 0; }
  .lib-item .li-title { font-size: 14px; font-weight: 600; }
  .lib-item .li-desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-item .li-state { font-size: 18px; flex: none; }
  .lib-empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }

  .month-list { display: flex; gap: 6px; flex-wrap: wrap; }
  .month-chip {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px; border-radius: 999px;
    font-size: 13px; cursor: pointer; transition: all .12s;
  }
  .month-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .month-chip:hover { color: var(--text); }

  footer { text-align: center; color: var(--muted); padding: 20px; font-size: 12px; }

  @supports (padding: env(safe-area-inset-top)) {
    header { padding-top: calc(24px + env(safe-area-inset-top)); }
    main { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏆</div>
    <div>
      <h1>Life Achievements</h1>
      <small>Цели и события жизни по месяцам</small>
    </div>
  </div>
  <div class="month-bar">
    <input type="month" id="newMonth" />
    <button class="btn ghost" id="addMonthBtn">+ Месяц</button>
    <button class="btn" id="openLibraryBtn">📚 Библиотека</button>
    <button class="btn ghost" id="installBtn" style="display:none">📲 Установить</button>
  </div>
</header>
<main>
  <div class="month-list" id="monthList"></div>
  <div style="height:16px"></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">🎯</div>
    <div>В этом месяце пока нет достижений</div>
    <div style="margin-top:12px"><button class="btn" id="emptyAddBtn">Выбрать из библиотеки</button></div>
  </div>
</main>

<!-- picker: assign existing achievements -->
<div class="modal-backdrop" id="pickerModal">
  <div class="modal">
    <h2>Достижения в «<span id="pickerMonth"></span>»</h2>
    <div class="field">
      <input id="searchInput" placeholder="Поиск по названию..." />
    </div>
    <div class="lib-list" id="libList"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="pickerClose">Закрыть</button>
      <div class="spacer"></div>
      <button class="btn" id="newAchBtn">+ Новое достижение</button>
    </div>
  </div>
</div>

<!-- editor: create/edit library achievement -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Новое достижение</h2>
    <div class="field">
      <label>Иконка</label>
      <div class="icon-picker" id="iconPicker"></div>
      <input type="hidden" id="iconValue" value="🏆">
    </div>
    <div class="field">
      <label>Название</label>
      <input id="titleInput" placeholder="Например: Сдал права на вождение" />
    </div>
    <div class="field">
      <label>Краткое описание</label>
      <textarea id="descInput" placeholder="Что происходило, как чувствовал себя..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="deleteLibBtn" style="display:none">Удалить из библиотеки</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="cancelBtn">Отмена</button>
      <button class="btn" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<footer>Библиотека достижений + назначение на месяцы · IndexedDB</footer>

<script>
const DB_NAME = 'lifeAchievements';
const DB_VERSION = 2;
let db = null;
let currentMonth = null;
let editingId = null;
let pickerOpen = false;

const ICONS = ['🏆','🎯','🚗','🐭','💊','😴','💼','📚','🏃','🧘','💰','🏠','✈️','🎮','🎵','🍳','🌱','❤️','🧠','💪','🎨','📝','🔧','📱','🌟','🔥','⚡','🎉','🩺','🐾','🧀','🫖','☕','🧹','🛠️','📎','🪪','🩹','🪴','📌'];

/* ---------- IndexedDB ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      const t = e.target.transaction;

      if (!d.objectStoreNames.contains('months')) {
        d.createObjectStore('months', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('achievements')) {
        d.createObjectStore('achievements', { keyPath: 'id', autoIncrement: true });
      }
      let assignStore;
      if (!d.objectStoreNames.contains('assignments')) {
        assignStore = d.createObjectStore('assignments', { keyPath: 'id', autoIncrement: true });
        assignStore.createIndex('monthId', 'monthId', { unique: false });
        assignStore.createIndex('achievementId', 'achievementId', { unique: false });
        assignStore.createIndex('month_ach', ['monthId', 'achievementId'], { unique: true });
      } else {
        assignStore = t.objectStore('assignments');
      }

      // Migration v1 -> v2: old achievements had a monthId; turn them into
      // reusable library entries + one assignment for that month.
      if (e.oldVersion < 2) {
        const oldStore = t.objectStore('achievements');
        const cursorReq = oldStore.openCursor();
        cursorReq.onsuccess = ev => {
          const c = ev.target.result;
          if (!c) return;
          const v = c.value;
          if (v.monthId) {
            try {
              const r = assignStore.add({ monthId: v.monthId, achievementId: c.primaryKey, createdAt: v.createdAt || Date.now() });
              r.onerror = ev => ev.preventDefault(); // keep transaction alive on duplicates
            } catch (err) { /* already assigned */ }
          }
          c.continue();
        };
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

function getAll(store) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store).objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function put(store, value) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readwrite').objectStore(store).put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function add(store, value) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readwrite').objectStore(store).add(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function del(store, key) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readwrite').objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function getAssignments(monthId) {
  return new Promise((resolve, reject) => {
    const idx = db.transaction('assignments').objectStore('assignments').index('monthId');
    const req = idx.getAll(monthId);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getAssignment(monthId, achievementId) {
  return new Promise((resolve, reject) => {
    const idx = db.transaction('assignments').objectStore('assignments').index('month_ach');
    const req = idx.get([monthId, achievementId]);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function assign(monthId, achievementId) {
  const existing = await getAssignment(monthId, achievementId);
  if (existing) return;
  await add('assignments', { monthId, achievementId, createdAt: Date.now() });
}

async function unassign(monthId, achievementId) {
  const existing = await getAssignment(monthId, achievementId);
  if (existing) await del('assignments', existing.id);
}

function deleteAchievementDeep(id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(['achievements', 'assignments'], 'readwrite');
    t.objectStore('achievements').delete(id);
    const idx = t.objectStore('assignments').index('achievementId');
    const req = idx.openCursor(IDBKeyRange.only(id));
    req.onsuccess = e => {
      const c = e.target.result;
      if (c) { c.delete(); c.continue(); }
    };
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}

function deleteMonthDeep(id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(['months', 'assignments'], 'readwrite');
    t.objectStore('months').delete(id);
    const idx = t.objectStore('assignments').index('monthId');
    const req = idx.openCursor(IDBKeyRange.only(id));
    req.onsuccess = e => {
      const c = e.target.result;
      if (c) { c.delete(); c.continue(); }
    };
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}

/* ---------- helpers ---------- */
function monthLabel(id) {
  const [y, m] = id.split('-');
  const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return `${names[parseInt(m) - 1]} ${y}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function currentMonthId() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

async function ensureMonth(id) {
  const all = await getAll('months');
  if (!all.find(m => m.id === id)) {
    await put('months', { id, createdAt: Date.now() });
  }
}

async function getMonthData(monthId) {
  const [lib, assigns] = await Promise.all([getAll('achievements'), getAssignments(monthId)]);
  const map = new Map(lib.map(a => [a.id, a]));
  return assigns
    .map(as => {
      const a = map.get(as.achievementId);
      return a ? { ...a, assignedAt: as.createdAt } : null;
    })
    .filter(Boolean)
    .sort((a, b) => (b.assignedAt || 0) - (a.assignedAt || 0));
}

/* ---------- init / render ---------- */
async function init() {
  await openDB();
  const all = await getAll('months');
  if (all.length === 0) await ensureMonth(currentMonthId());
  const months = await getAll('months');
  months.sort((a, b) => b.id.localeCompare(a.id));
  currentMonth = months[0].id;
  renderMonthList(months);
  await render();
}

function renderMonthList(months) {
  const el = document.getElementById('monthList');
  el.innerHTML = '';
  months.sort((a, b) => b.id.localeCompare(a.id));
  months.forEach(m => {
    const chip = document.createElement('button');
    chip.className = 'month-chip' + (m.id === currentMonth ? ' active' : '');
    chip.textContent = monthLabel(m.id);
    chip.onclick = async () => {
      currentMonth = m.id;
      renderMonthList(await getAll('months'));
      await render();
    };
    let timer;
    chip.onmousedown = () => {
      timer = setTimeout(async () => {
        if (confirm(`Удалить «${monthLabel(m.id)}» и его назначения?`)) {
          await deleteMonthDeep(m.id);
          let ms = await getAll('months');
          if (ms.length === 0) {
            await ensureMonth(currentMonthId());
            ms = await getAll('months');
          }
          ms.sort((a, b) => b.id.localeCompare(a.id));
          currentMonth = ms[0].id;
          renderMonthList(ms);
          await render();
        }
      }, 900);
    };
    chip.onmouseup = () => clearTimeout(timer);
    chip.onmouseleave = () => clearTimeout(timer);
    el.appendChild(chip);
  });
}

async function render() {
  const achs = await getMonthData(currentMonth);
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  if (achs.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    achs.forEach(a => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="icon">${a.icon}</div>
        <h3>${escapeHtml(a.title)}</h3>
        <p>${escapeHtml(a.desc || '')}</p>
        <div class="actions">
          <button class="btn ghost" data-edit="${a.id}">✏️</button>
          <button class="btn ghost" data-remove="${a.id}">Убрать из месяца</button>
        </div>`;
      grid.appendChild(card);
    });
    grid.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEditor(parseInt(b.dataset.edit)));
    grid.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
      await unassign(currentMonth, parseInt(b.dataset.remove));
      await render();
    });
  }
  await renderStats();
}

async function renderStats() {
  const [lib, assigns, months] = await Promise.all([
    getAll('achievements'), getAll('assignments'), getAll('months')
  ]);
  const inMonth = assigns.filter(a => a.monthId === currentMonth).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">В этом месяце</div><div class="value">${inMonth}</div></div>
    <div class="stat"><div class="label">В библиотеке</div><div class="value">${lib.length}</div></div>
    <div class="stat"><div class="label">Месяцев всего</div><div class="value">${months.length}</div></div>
    <div class="stat"><div class="label">Назначений всего</div><div class="value">${assigns.length}</div></div>
  `;
}

/* ---------- library picker ---------- */
function openPicker() {
  pickerOpen = true;
  document.getElementById('pickerMonth').textContent = monthLabel(currentMonth);
  document.getElementById('searchInput').value = '';
  document.getElementById('pickerModal').classList.add('open');
  renderLibraryList();
}

function closePicker() {
  pickerOpen = false;
  document.getElementById('pickerModal').classList.remove('open');
}

async function renderLibraryList() {
  const [lib, assigns] = await Promise.all([getAll('achievements'), getAssignments(currentMonth)]);
  const assignedIds = new Set(assigns.map(a => a.achievementId));
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('libList');
  const items = lib
    .filter(a => !q || a.title.toLowerCase().includes(q) || (a.desc || '').toLowerCase().includes(q))
    .sort((a, b) => {
      const ai = assignedIds.has(a.id), bi = assignedIds.has(b.id);
      if (ai !== bi) return ai ? -1 : 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

  list.innerHTML = '';
  if (items.length === 0) {
    list.innerHTML = `<div class="lib-empty">${lib.length === 0 ? 'Библиотека пуста — создайте первое достижение' : 'Ничего не найдено'}</div>`;
    return;
  }
  items.forEach(a => {
    const assigned = assignedIds.has(a.id);
    const item = document.createElement('div');
    item.className = 'lib-item' + (assigned ? ' assigned' : '');
    item.innerHTML = `
      <div class="li-icon">${a.icon}</div>
      <div class="li-body">
        <div class="li-title">${escapeHtml(a.title)}</div>
        <div class="li-desc">${escapeHtml(a.desc || '')}</div>
      </div>
      <div class="li-state">${assigned ? '✓' : '＋'}</div>`;
    item.onclick = async () => {
      if (assigned) await unassign(currentMonth, a.id);
      else await assign(currentMonth, a.id);
      await renderLibraryList();
      await render();
    };
    list.appendChild(item);
  });
}

/* ---------- editor ---------- */
function buildIconPicker(selected) {
  const el = document.getElementById('iconPicker');
  el.innerHTML = '';
  ICONS.forEach(ic => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = ic;
    if (ic === selected) b.classList.add('selected');
    b.onclick = () => {
      document.getElementById('iconValue').value = ic;
      el.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
    };
    el.appendChild(b);
  });
}

async function openEditor(editId = null) {
  editingId = editId;
  const title = document.getElementById('modalTitle');
  const delBtn = document.getElementById('deleteLibBtn');
  if (editId) {
    const lib = await getAll('achievements');
    const a = lib.find(x => x.id === editId);
    if (!a) return;
    title.textContent = 'Редактировать достижение';
    document.getElementById('titleInput').value = a.title;
    document.getElementById('descInput').value = a.desc || '';
    document.getElementById('iconValue').value = a.icon;
    buildIconPicker(a.icon);
    delBtn.style.display = 'inline-block';
  } else {
    title.textContent = 'Новое достижение';
    document.getElementById('titleInput').value = '';
    document.getElementById('descInput').value = '';
    document.getElementById('iconValue').value = '🏆';
    buildIconPicker('🏆');
    delBtn.style.display = 'none';
  }
  document.getElementById('modal').classList.add('open');
}

function closeEditor() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

document.getElementById('saveBtn').onclick = async () => {
  const title = document.getElementById('titleInput').value.trim();
  if (!title) { alert('Введите название'); return; }
  const icon = document.getElementById('iconValue').value;
  const desc = document.getElementById('descInput').value.trim();

  if (editingId) {
    const lib = await getAll('achievements');
    const a = lib.find(x => x.id === editingId);
    if (a) {
      a.title = title; a.icon = icon; a.desc = desc;
      await put('achievements', a);
    }
  } else {
    const id = await add('achievements', { icon, title, desc, createdAt: Date.now() });
    await assign(currentMonth, id);
  }

  closeEditor();
  await render();
  if (pickerOpen) await renderLibraryList();
};

document.getElementById('deleteLibBtn').onclick = async () => {
  if (!editingId) return;
  if (!confirm('Удалить достижение из библиотеки и убрать из всех месяцев?')) return;
  await deleteAchievementDeep(editingId);
  closeEditor();
  await render();
  if (pickerOpen) await renderLibraryList();
};

document.getElementById('cancelBtn').onclick = closeEditor;
document.getElementById('pickerClose').onclick = closePicker;
document.getElementById('openLibraryBtn').onclick = () => openPicker();
document.getElementById('emptyAddBtn').onclick = () => openPicker();
document.getElementById('newAchBtn').onclick = () => openEditor(null);
document.getElementById('searchInput').oninput = () => renderLibraryList();

const addBtn = document.createElement('button');
addBtn.className = 'btn';
addBtn.textContent = '+ В месяц';
addBtn.style.position = 'fixed';
addBtn.style.bottom = '24px';
addBtn.style.right = '24px';
addBtn.style.zIndex = '20';
addBtn.onclick = () => openPicker();
document.body.appendChild(addBtn);

document.getElementById('addMonthBtn').onclick = async () => {
  const v = document.getElementById('newMonth').value;
  if (!v) { alert('Выберите месяц'); return; }
  await ensureMonth(v);
  currentMonth = v;
  renderMonthList(await getAll('months'));
  await render();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modal').classList.contains('open')) closeEditor();
    else if (pickerOpen) closePicker();
  }
});

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});
installBtn.onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
};
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});

init().then(() => {
  if (new URLSearchParams(location.search).get('view') === 'library') openPicker();
});
</script>
</body>
