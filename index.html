<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Achievements</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel2: #1b2030;
    --border: #2a3144;
    --text: #e6e9f0;
    --muted: #8a93a8;
    --accent: #7c5cff;
    --accent2: #3dd6f5;
    --gold: #f5c542;
    --danger: #ff5c7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1a1f3a 0%, transparent 60%),
                radial-gradient(900px 500px at 90% 10%, #2a1a3a 0%, transparent 60%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(20,24,33,0.6);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-size: 22px;
    box-shadow: 0 0 24px rgba(124,92,255,0.4);
  }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
  .brand small { color: var(--muted); font-size: 12px; }
  .month-bar { display: flex; align-items: center; gap: 10px; }
  .month-bar select, .month-bar input {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 14px;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent), #5a42e0);
    color: #fff; border: none; border-radius: 8px;
    padding: 9px 14px; font-size: 14px; cursor: pointer;
    transition: transform .12s, box-shadow .12s;
    box-shadow: 0 4px 14px rgba(124,92,255,0.3);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,92,255,0.45); }
  .btn.ghost { background: var(--panel2); box-shadow: none; border: 1px solid var(--border); }
  .btn.danger { background: linear-gradient(135deg, var(--danger), #d93a5c); box-shadow: 0 4px 14px rgba(255,92,122,0.3); }

  main { padding: 28px; max-width: 1200px; margin: 0 auto; }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 4px;
    background: linear-gradient(135deg, var(--gold), #ff9f43); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; position: relative; overflow: hidden;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(124,92,255,0.25); }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(200px 120px at 0% 0%, rgba(124,92,255,0.12), transparent 70%);
    pointer-events: none;
  }
  .card .icon {
    width: 52px; height: 52px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 28px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
  }
  .card h3 { margin: 12px 0 4px; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .card .actions { margin-top: 12px; display: flex; gap: 8px; }
  .card .actions button { flex: 1; padding: 6px; font-size: 12px; border-radius: 6px; }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    border: 2px dashed var(--border); border-radius: 16px;
  }
  .empty .big { font-size: 48px; margin-bottom: 8px; }

  /* modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; width: 90%; max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .icon-picker {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    max-height: 160px; overflow: auto; padding: 6px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  }
  .icon-picker button {
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    font-size: 20px; padding: 6px; cursor: pointer; color: var(--text);
  }
  .icon-picker button:hover { background: var(--panel); }
  .icon-picker button.selected { border-color: var(--accent); background: rgba(124,92,255,0.15); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  .month-list { display: flex; gap: 6px; flex-wrap: wrap; }
  .month-chip {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px; border-radius: 999px;
    font-size: 13px; cursor: pointer; transition: all .12s;
  }
  .month-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .month-chip:hover { color: var(--text); }

  footer { text-align: center; color: var(--muted); padding: 20px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🏆</div>
    <div>
      <h1>Life Achievements</h1>
      <small>Цели и события жизни по месяцам</small>
    </div>
  </div>
  <div class="month-bar">
    <input type="month" id="newMonth" />
    <button class="btn" id="addMonthBtn">+ Месяц</button>
  </div>
</header>
<main>
  <div class="month-list" id="monthList"></div>
  <div style="height:16px"></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">🎯</div>
    <div>В этом месяце пока нет достижений</div>
    <div style="margin-top:12px"><button class="btn" id="emptyAddBtn">Добавить</button></div>
  </div>
</main>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Новое достижение</h2>
    <div class="field">
      <label>Иконка</label>
      <div class="icon-picker" id="iconPicker"></div>
      <input type="hidden" id="iconValue" value="🏆">
    </div>
    <div class="field">
      <label>Название</label>
      <input id="titleInput" placeholder="Например: Сдал права на вождение" />
    </div>
    <div class="field">
      <label>Краткое описание</label>
      <textarea id="descInput" placeholder="Что происходило, как чувствовал себя..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Отмена</button>
      <button class="btn" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<footer>Хранится в IndexedDB · локально в браузере</footer>

<script>
const DB_NAME = 'lifeAchievements';
const DB_VERSION = 1;
let db = null;
let currentMonth = null;
let editingId = null;

const ICONS = ['🏆','🎯','🚗','🐭','💊','😴','💼','📚','🏃','🧘','💰','🏠','✈️','🎮','🎵','🍳','🌱','❤️','🧠','💪','🎨','📝','🔧','📱','🌟','🔥','⚡','🎉','🩺','🐾','🧀','🫖','☕','🧹','🛠️','📎','🪪','🩹','🪴','📌'];

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('months')) {
        d.createObjectStore('months', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('achievements')) {
        const s = d.createObjectStore('achievements', { keyPath: 'id', autoIncrement: true });
        s.createIndex('monthId', 'monthId', { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

function tx(store, mode='readonly') {
  return db.transaction(store, mode).objectStore(store);
}

function getAll(store) {
  return new Promise((resolve, reject) => {
    const req = tx(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getAchievements(monthId) {
  return new Promise((resolve, reject) => {
    const idx = tx('achievements').index('monthId');
    const req = idx.getAll(monthId);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function putMonth(m) {
  return new Promise((resolve, reject) => {
    const req = tx('months', 'readwrite').put(m);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function addAchievement(a) {
  return new Promise((resolve, reject) => {
    const req = tx('achievements', 'readwrite').add(a);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function updateAchievement(a) {
  return new Promise((resolve, reject) => {
    const req = tx('achievements', 'readwrite').put(a);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function deleteAchievement(id) {
  return new Promise((resolve, reject) => {
    const req = tx('achievements', 'readwrite').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function deleteMonth(id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(['months','achievements'], 'readwrite');
    t.objectStore('months').delete(id);
    const idx = t.objectStore('achievements').index('monthId');
    const r = idx.openCursor(IDBKeyRange.only(id));
    r.onsuccess = e => {
      const c = e.target.result;
      if (c) { c.delete(); c.continue(); }
    };
    t.oncomplete = () => resolve();
    t.onerror = () => reject(t.error);
  });
}

function monthLabel(id) {
  const [y,m] = id.split('-');
  const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return `${names[parseInt(m)-1]} ${y}`;
}

async function ensureMonth(id) {
  const all = await getAll('months');
  if (!all.find(m => m.id === id)) {
    await putMonth({ id, createdAt: Date.now() });
  }
}

async function init() {
  await openDB();
  const all = await getAll('months');
  if (all.length === 0) {
    const now = new Date();
    const id = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    await ensureMonth(id);
  }
  const months = await getAll('months');
  months.sort((a,b) => b.id.localeCompare(a.id));
  currentMonth = months[0].id;
  renderMonthList(months);
  await render();
}

function renderMonthList(months) {
  const el = document.getElementById('monthList');
  el.innerHTML = '';
  months.sort((a,b) => b.id.localeCompare(a.id));
  months.forEach(m => {
    const chip = document.createElement('button');
    chip.className = 'month-chip' + (m.id === currentMonth ? ' active' : '');
    chip.textContent = monthLabel(m.id);
    chip.onclick = async () => {
      currentMonth = m.id;
      renderMonthList(await getAll('months'));
      await render();
    };
    // long press to delete
    let timer;
    chip.onmousedown = () => { timer = setTimeout(async () => {
      if (confirm('Удалить месяц и все его достижения?')) {
        await deleteMonth(m.id);
        const ms = await getAll('months');
        if (ms.length === 0) {
          const now = new Date();
          const id = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
          await ensureMonth(id);
        }
        const ms2 = await getAll('months');
        ms2.sort((a,b)=>b.id.localeCompare(a.id));
        currentMonth = ms2[0].id;
        renderMonthList(ms2);
        await render();
      }
    }, 900); };
    chip.onmouseup = () => clearTimeout(timer);
    chip.onmouseleave = () => clearTimeout(timer);
    el.appendChild(chip);
  });
}

async function render() {
  const achs = await getAchievements(currentMonth);
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  if (achs.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    achs.sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
    achs.forEach(a => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="icon">${a.icon}</div>
        <h3>${escapeHtml(a.title)}</h3>
        <p>${escapeHtml(a.desc || '')}</p>
        <div class="actions">
          <button class="btn ghost" data-edit="${a.id}">✏️</button>
          <button class="btn danger" data-del="${a.id}">🗑</button>
        </div>`;
      grid.appendChild(card);
    });
    grid.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openModal(parseInt(b.dataset.edit)));
    grid.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (confirm('Удалить достижение?')) {
        await deleteAchievement(parseInt(b.dataset.del));
        await render();
        await renderStats();
      }
    });
  }
  await renderStats();
}

async function renderStats() {
  const achs = await getAchievements(currentMonth);
  const allMonths = await getAll('months');
  let totalAch = 0;
  for (const m of allMonths) totalAch += (await getAchievements(m.id)).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">Достижений в месяце</div><div class="value">${achs.length}</div></div>
    <div class="stat"><div class="label">Месяцев всего</div><div class="value">${allMonths.length}</div></div>
    <div class="stat"><div class="label">Всего достижений</div><div class="value">${totalAch}</div></div>
    <div class="stat"><div class="label">Текущий месяц</div><div class="value" style="font-size:18px">${monthLabel(currentMonth)}</div></div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// icon picker
function buildIconPicker(selected) {
  const el = document.getElementById('iconPicker');
  el.innerHTML = '';
  ICONS.forEach(ic => {
    const b = document.createElement('button');
    b.textContent = ic;
    if (ic === selected) b.classList.add('selected');
    b.onclick = () => {
      document.getElementById('iconValue').value = ic;
      el.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
    };
    el.appendChild(b);
  });
}

function openModal(editId = null) {
  editingId = editId;
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  if (editId) {
    title.textContent = 'Редактировать достижение';
    getAchievements(currentMonth).then(achs => {
      const a = achs.find(x => x.id === editId);
      if (a) {
        document.getElementById('titleInput').value = a.title;
        document.getElementById('descInput').value = a.desc || '';
        document.getElementById('iconValue').value = a.icon;
        buildIconPicker(a.icon);
      }
    });
  } else {
    title.textContent = 'Новое достижение';
    document.getElementById('titleInput').value = '';
    document.getElementById('descInput').value = '';
    document.getElementById('iconValue').value = '🏆';
    buildIconPicker('🏆');
  }
  modal.classList.add('open');
}

document.getElementById('saveBtn').onclick = async () => {
  const title = document.getElementById('titleInput').value.trim();
  if (!title) { alert('Введите название'); return; }
  const icon = document.getElementById('iconValue').value;
  const desc = document.getElementById('descInput').value.trim();
  if (editingId) {
    const achs = await getAchievements(currentMonth);
    const a = achs.find(x => x.id === editingId);
    a.title = title; a.icon = icon; a.desc = desc;
    await updateAchievement(a);
  } else {
    await addAchievement({ monthId: currentMonth, icon, title, desc, createdAt: Date.now() });
  }
  document.getElementById('modal').classList.remove('open');
  editingId = null;
  await render();
};

document.getElementById('cancelBtn').onclick = () => {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
};

document.getElementById('emptyAddBtn').onclick = () => openModal();
// add achievement button floating
const addBtn = document.createElement('button');
addBtn.className = 'btn';
addBtn.textContent = '+ Достижение';
addBtn.style.position = 'fixed';
addBtn.style.bottom = '24px';
addBtn.style.right = '24px';
addBtn.style.zIndex = '20';
addBtn.onclick = () => openModal();
document.body.appendChild(addBtn);

document.getElementById('addMonthBtn').onclick = async () => {
  const v = document.getElementById('newMonth').value;
  if (!v) { alert('Выберите месяц'); return; }
  await ensureMonth(v);
  currentMonth = v;
  const ms = await getAll('months');
  renderMonthList(ms);
  await render();
};

init();
</script>
</body>
</html>
